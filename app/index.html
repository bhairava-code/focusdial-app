<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FocusDial</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main class="stage">
  <div id="home">
    <div id="widget" class="card" data-mode="focus">
      <header class="top">
        <nav class="tabs" id="tabs">
          <button data-m="focus" class="active" title="Focus (1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></svg></button>
          <button data-m="short" title="Short break (2)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><path d="M6 2v2M10 2v2M14 2v2"/></svg></button>
          <button data-m="long" title="Long break (3)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button>
        </nav>
        <div class="grow"></div>
        <div class="icons">
          <button class="ib" id="btnPanel" title="Tasks &amp; habits (T)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3 6 1.5 1.5L7 5M3 12l1.5 1.5L7 11M3 18l1.5 1.5L7 17"/></svg></button>
          <button class="ib" id="btnCompact" title="Compact view (C)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/></svg></button>
          <button class="ib web-only" id="btnFull" title="Fullscreen (F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
          <button class="ib" id="btnSettings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
          <button class="ib" id="btnPop" title="Keep on top (P)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76V6h6v4.76a2 2 0 0 0 1.11 1.79l1.78.9A2 2 0 0 1 19 15.24V17H5v-1.76a2 2 0 0 1 1.11-1.79l1.78-.9A2 2 0 0 0 9 10.76z"/><path d="M8 3h8"/></svg></button>
          <span class="wsep desk-only"></span>
          <button class="ib desk-only" id="btnMin" title="Minimize"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
          <button class="ib wclose desk-only" id="btnX" title="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </div>
      </header>

      <div class="flipclock big" id="clock">
        <div class="pair" id="cH"><span class="ampm" id="ampm"></span></div>
        <div class="colon"><i></i><i></i></div>
        <div class="pair" id="cM"></div>
        <div class="colon secpart"><i></i><i></i></div>
        <div class="pair secpart" id="cS"></div>
      </div>
      <div class="date" id="date"></div>

      <section class="pomo">
        <div class="dialbox">
          <svg viewBox="0 0 200 200">
            <circle class="ring-bg" cx="100" cy="100" r="94"/>
            <circle class="ring" id="ring" cx="100" cy="100" r="94" transform="rotate(-90 100 100)"/>
            <circle class="face" cx="100" cy="100" r="82"/>
            <g id="ticks"></g>
            <line id="hHour" class="hand hour" x1="100" y1="112" x2="100" y2="56"/>
            <line id="hMin" class="hand min" x1="100" y1="116" x2="100" y2="34"/>
            <g id="hSec"><line class="hand sec" x1="100" y1="122" x2="100" y2="26"/><circle class="sec-cap" cx="100" cy="100" r="5.5"/></g>
            <circle class="pin" cx="100" cy="100" r="2.2"/>
          </svg>
        </div>
        <div class="pright">
          <div class="prow"><div class="dots" id="dots" title="Focus sessions this cycle"></div><span class="tomato" title="Focus sessions today">🍅<b id="todayN">0</b></span></div>
          <div class="flipclock small" id="timer">
            <div class="pair" id="tM"></div>
            <div class="colon"><i></i><i></i></div>
            <div class="pair" id="tS"></div>
          </div>
          <div class="controls">
            <button class="cb" id="btnReset" title="Reset (R)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
            <button class="play" id="btnPlay" title="Start / pause (Space)">
              <svg class="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
              <svg class="i-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.2" height="14" rx="1.4"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.4"/></svg></button>
            <button class="cb" id="btnSkip" title="Skip (S)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4l10 8-10 8V4z"/><path d="M19 5v14"/></svg></button>
          </div>
        </div>
      </section>

      <section class="panel" id="panel">
        <div class="phead">
          <div class="ptabs">
            <button data-p="tasks" class="active" title="Tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg></button>
            <button data-p="habits" title="Habits"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c4 0 7-2.7 7-7 0-3.5-2.2-5.8-4-7.5-.3 2-1.3 3.4-2.6 4C12.9 8.6 11.6 5 8.5 2 8.8 6 5 8.6 5 15c0 4.3 3 7 7 7Z"/></svg></button>
          </div>
          <div class="bigbatt" id="bigBatt"><div class="shell"><div class="fill" id="bigFill"></div></div><span class="nub"></span></div>
          <span class="pct" id="pct">0%</span>
          <button class="ib" id="btnClearDone" title="Clear finished tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>
          <button class="ib desk-only" id="btnHabitFolder" title="Open habit log files" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg></button>
        </div>

        <div id="tasksView">
          <ul class="list tlist" id="tlist"></ul>
          <form class="tadd" id="taskForm" autocomplete="off">
            <input type="text" id="newTask" placeholder="Add a task…" maxlength="80">
            <div class="est" title="Estimated pomodoros"><button type="button" class="mini" data-d="-1">−</button><b id="newEst">2</b><small>🍅</small><button type="button" class="mini" data-d="1">+</button></div>
            <label class="calbtn" id="calBtn" title="Due date"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><input type="date" id="newDue"></label>
            <button type="submit" class="addbtn" title="Add task"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
          </form>
        </div>

        <div id="habitsView" hidden>
          <ul class="list hlist" id="hlist"></ul>
          <form class="tadd" id="habitForm" autocomplete="off">
            <input type="text" id="newHabit" placeholder="New habit…" maxlength="50">
            <div class="est" title="Target days per week"><button type="button" class="mini" data-h="-1">−</button><b id="newTarget">7</b><small>/7</small><button type="button" class="mini" data-h="1">+</button></div>
            <button type="submit" class="addbtn" title="Add habit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
          </form>
        </div>
      </section>

      <div class="settings" id="settings" hidden>
        <div class="s-head"><b>⚙️ Settings</b><button class="ib" id="btnClose"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div class="s-label">1️⃣ Timer (minutes)</div>
        <div class="s-grid">
          <label class="field">Focus<input type="number" id="sFocus" min="1" max="99"></label>
          <label class="field">Short break<input type="number" id="sShort" min="1" max="99"></label>
          <label class="field">Long break<input type="number" id="sLong" min="1" max="99"></label>
          <label class="field">Long after<input type="number" id="sEvery" min="2" max="10"></label>
        </div>
        <div class="s-label">2️⃣ Clock &amp; behaviour</div>
        <div class="togs">
          <label class="tog">24-hour clock<input type="checkbox" id="s24"></label>
          <label class="tog">Show seconds<input type="checkbox" id="sSec"></label>
          <label class="tog">Show date<input type="checkbox" id="sDate"></label>
          <label class="tog">Analog dial<input type="checkbox" id="sAnalog"></label>
          <label class="tog">Auto-start breaks<input type="checkbox" id="sAutoBreak"></label>
          <label class="tog">Auto-start focus<input type="checkbox" id="sAutoFocus"></label>
          <label class="tog">Chime sound<input type="checkbox" id="sSound"></label>
          <label class="tog">Notifications<input type="checkbox" id="sNotify"></label>
        </div>
        <div class="desk-only">
          <div class="s-label">3️⃣ Window</div>
          <div class="togs">
            <label class="tog">Always on top<input type="checkbox" id="wTop"></label>
            <label class="tog">Start with Windows<input type="checkbox" id="wAuto"></label>
            <label class="tog">Show in taskbar<input type="checkbox" id="wTask"></label>
            <label class="tog">Close to tray<input type="checkbox" id="wTray"></label>
          </div>
          <div class="slider gap-top">Opacity<input type="range" id="wOpacity" min="30" max="100" step="5"><b id="wOpVal">100%</b></div>
        </div>
        <div class="s-label"><span class="desk-only">4️⃣</span><span class="web-only">3️⃣</span> Size</div>
        <div class="seg" id="sizes"><button data-s="0.85">S</button><button data-s="1">M</button><button data-s="1.2">L</button><button data-s="1.45">XL</button></div>
        <div class="s-label"><span class="desk-only">5️⃣</span><span class="web-only">4️⃣</span> Theme</div>
        <div class="themes" id="themes"></div>
        <div class="s-actions">
          <button id="btnTest">🔔 Test chime</button>
          <button id="btnResetDay">↺ Reset today</button>
          <button class="desk-only" id="btnLogs">📂 Habit logs</button>
        </div>
      </div>
      <div class="toast" id="toast"></div>
    </div>

    <div class="floating-note" id="floatingNote" hidden>📌<button id="btnBringBack" title="Bring back">↩</button></div>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
